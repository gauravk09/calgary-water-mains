stages:
  download:
    cmd: python -m src.pipeline.download_data
    deps:
      - src/pipeline/download_data.py
    outs:
      - data/raw
  features:
    cmd: python -m src.features
    deps:
      - src/data.py
      - src/features.py
      - data/raw
    outs:
      - data/features
  features_annual:
    cmd: python -m src.features --horizon 1 --annual --out data/features_annual
    deps:
      - src/data.py
      - src/features.py
      - data/raw
    outs:
      - data/features_annual
